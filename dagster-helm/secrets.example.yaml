# =============================================================================
# Secret 範本（請勿把真實密碼 commit 進 repo）
#
# 建議改用指令建立，或交給公司的 Secret 管理工具（Vault / External Secrets）：
#
#   kubectl -n dagster create secret generic dagster-postgresql-secret \
#     --from-literal=postgresql-password='<PASSWORD>'
#
#   # 若啟用 S3ComputeLogManager
#   kubectl -n dagster create secret generic dagster-s3-credentials \
#     --from-literal=AWS_ACCESS_KEY_ID='<KEY>' \
#     --from-literal=AWS_SECRET_ACCESS_KEY='<SECRET>'
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: dagster-postgresql-secret      # 對應 global.postgresqlSecretName
  namespace: dagster
type: Opaque
stringData:
  postgresql-password: "CHANGE_ME"     # key 名稱固定為 postgresql-password
---
apiVersion: v1
kind: Secret
metadata:
  name: dagster-s3-credentials
  namespace: dagster
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
