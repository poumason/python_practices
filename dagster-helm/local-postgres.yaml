# 本機驗證用的陽春 PostgreSQL，拿來模擬「公司既有 DB」。
# 正式環境不會用這個，是接公司既有的 PostgreSQL（見 values-dagster.yaml）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-postgres
  namespace: dagster
spec:
  replicas: 1
  selector:
    matchLabels: {app: local-postgres}
  template:
    metadata:
      labels: {app: local-postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              value: dagster
            - name: POSTGRES_PASSWORD
              value: dagster-local-test
            - name: POSTGRES_DB
              value: dagster
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "dagster"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: local-postgres
  namespace: dagster
spec:
  selector: {app: local-postgres}
  ports:
    - port: 5432
      targetPort: 5432
