---
# Public /oauth2 path — handled by oauth2-proxy (no auth annotation here to avoid a redirect loop)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oauth2-proxy-public
  namespace: kubernetes-dashboard
spec:
  ingressClassName: nginx
  rules:
  - host: kubedashboard.localhost
    http:
      paths:
      - path: /oauth2
        pathType: Prefix
        backend:
          service:
            name: oauth2-proxy
            port:
              number: 4180

---
# Protected dashboard — nginx checks auth via dashboard-auth-injector
# (05-static-auth-injector.yaml), which internally re-checks with oauth2-proxy
# (same email-allowlist gate as before) and, on success, stamps a fixed
# static ServiceAccount token onto the response. auth-response-headers then
# copies that into the request forwarded to the dashboard.
#
# Previously this pointed straight at oauth2-proxy and forwarded each user's
# own GitLab ID token (see git history / README) — that kept expiring
# mid-session and forcing re-logins, so every allowlisted user now shares one
# static, non-expiring identity instead. This also means the per-email
# admin/viewer RBAC split (03-rbac.yaml, 04-viewer-nodes-rbac.yaml) no longer
# applies to anyone going through here — see 05-static-auth-injector.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubernetes-dashboard-ingress
  namespace: kubernetes-dashboard
  annotations:
    nginx.ingress.kubernetes.io/auth-url: "http://dashboard-auth-injector.kubernetes-dashboard.svc.cluster.local:8080/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://kubedashboard.localhost/oauth2/start?rd=$scheme://$host$request_uri$is_args$args"
    nginx.ingress.kubernetes.io/auth-response-headers: "Authorization"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    # The injected token is a Kubernetes ServiceAccount JWT, which can still
    # be bigger than nginx's default proxy_buffer_size (4k/8k). Without this,
    # nginx logs "upstream sent too big header while reading response header
    # from upstream ... subrequest: /auth" and the auth check fails. Bump
    # further (e.g. "32k") if the warning persists.
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
spec:
  ingressClassName: nginx
  rules:
  - host: kubedashboard.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kubernetes-dashboard-kong-proxy
            port:
              number: 443
