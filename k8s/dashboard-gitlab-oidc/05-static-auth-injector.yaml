---
# Decision (2026-09): stop forwarding each user's own OIDC token to
# kube-apiserver — it kept expiring mid-session even after tightening
# --cookie-refresh. Every allowed user instead reaches the Dashboard/API
# server as one of three FIXED, non-expiring static identities below, chosen
# by this request's claims. oauth2-proxy's job is just "is this person
# allowed to log in at all" (now: anyone on the company email domain); the
# actual permission tier is decided here, by dashboard-auth-injector.
#
# Update (2026-11): extended from a single static-admin identity to three
# tiers, keyed off claims in the real OIDC ID token (email, and a custom
# "dept_id" claim from Keycloak):
#   - specific named emails            -> cluster-admin
#   - specific department IDs          -> operate pods + read workload/network resources
#   - everyone else on the email domain -> view + delete pods only
#
# This means 03-rbac.yaml / 04-viewer-nodes-rbac.yaml (the earlier per-user
# GitLab-OIDC-token design) no longer apply to anyone going through here —
# left in place, unused, in case of a revert.

# ---------------------------------------------------------------------------
# Tier 1: cluster-admin (named individuals)
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-static-admin
  namespace: kubernetes-dashboard
---
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-static-admin-token
  namespace: kubernetes-dashboard
  annotations:
    kubernetes.io/service-account.name: dashboard-static-admin
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dashboard-static-admin-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: dashboard-static-admin
  namespace: kubernetes-dashboard

# ---------------------------------------------------------------------------
# Tier 2: pod-operator (specific department IDs, e.g. 0021003 / 0021004) —
# full CRUD + logs on pods, read-only on the related workload/network/storage
# resources needed to actually operate pods day-to-day. No pods/exec.
# ---------------------------------------------------------------------------
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-pod-operator
  namespace: kubernetes-dashboard
---
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-pod-operator-token
  namespace: kubernetes-dashboard
  annotations:
    kubernetes.io/service-account.name: dashboard-pod-operator
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dashboard-pod-operator-role
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["services", "persistentvolumes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dashboard-pod-operator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dashboard-pod-operator-role
subjects:
- kind: ServiceAccount
  name: dashboard-pod-operator
  namespace: kubernetes-dashboard

# ---------------------------------------------------------------------------
# Tier 3: pod-deleter (default for everyone else on the company email
# domain) — can see and delete pods, nothing else.
# ---------------------------------------------------------------------------
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-pod-deleter
  namespace: kubernetes-dashboard
---
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-pod-deleter-token
  namespace: kubernetes-dashboard
  annotations:
    kubernetes.io/service-account.name: dashboard-pod-deleter
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dashboard-pod-deleter-role
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dashboard-pod-deleter-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dashboard-pod-deleter-role
subjects:
- kind: ServiceAccount
  name: dashboard-pod-deleter
  namespace: kubernetes-dashboard

# ---------------------------------------------------------------------------
# dashboard-auth-injector: sits between nginx's auth-url check and
# oauth2-proxy. Not an Ingress resource, so ingress-nginx's
# "no configuration-snippet" admission policy doesn't apply at all.
#
# A single plain-nginx "add_header a static token" (the pre-2026-11 version
# of this file) can't do claim-based routing — picking a token based on a
# custom "dept_id" JWT claim needs actual JWT decoding and conditional logic,
# which stock nginx directives can't express. So this is now a small
# stdlib-only Python service instead (no pip installs, no custom image build
# — just the official python:3.12-alpine image running a script mounted from
# a ConfigMap).
#
# Flow per request to /auth:
#   1. Forward the browser's Cookie header to oauth2-proxy's /oauth2/auth
#      (reusing its existing login-gate / session check).
#   2. If oauth2-proxy says no (non-2xx) -> return 401 (nginx's auth-signin
#      still redirects to login, same as before).
#   3. If yes, oauth2-proxy's response also carries
#      "Authorization: Bearer <the real Keycloak ID token>" (set by
#      --set-authorization-header=true in 01-oauth2proxy.yaml). Decode that
#      JWT's payload (no signature re-verification — oauth2-proxy already
#      validated it; we're only reading claims to pick a tier, not making a
#      trust decision on our own) to get "email" and "dept_id".
#   4. Pick the static token for the matching tier and return it as this
#      response's own Authorization header. nginx's auth-response-headers
#      annotation (a plain annotation, not a snippet) copies that into the
#      request forwarded to the real Dashboard backend.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-auth-injector-script
  namespace: kubernetes-dashboard
data:
  server.py: |
    import base64
    import http.client
    import json
    import os
    import sys
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    OAUTH2_PROXY_HOST = "oauth2-proxy.kubernetes-dashboard.svc.cluster.local"
    OAUTH2_PROXY_PORT = 4180

    def _split_csv(value):
        return {v.strip() for v in value.split(",") if v.strip()}

    ADMIN_EMAILS = {e.lower() for e in _split_csv(os.environ.get("ADMIN_EMAILS", ""))}
    POD_OPERATOR_DEPT_IDS = _split_csv(os.environ.get("POD_OPERATOR_DEPT_IDS", ""))

    ADMIN_TOKEN = os.environ["ADMIN_TOKEN"]
    POD_OPERATOR_TOKEN = os.environ["POD_OPERATOR_TOKEN"]
    POD_DELETER_TOKEN = os.environ["POD_DELETER_TOKEN"]

    def decode_jwt_payload(token):
        try:
            payload_b64 = token.split(".")[1]
            padded = payload_b64 + "=" * (-len(payload_b64) % 4)
            return json.loads(base64.urlsafe_b64decode(padded))
        except Exception:
            return {}

    def pick_static_token(claims):
        email = str(claims.get("email", "")).strip().lower()
        dept_id = str(claims.get("dept_id", "")).strip()
        if email in ADMIN_EMAILS:
            return ADMIN_TOKEN
        if dept_id in POD_OPERATOR_DEPT_IDS:
            return POD_OPERATOR_TOKEN
        return POD_DELETER_TOKEN

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path.split("?", 1)[0] != "/auth":
                self.send_response(404)
                self.end_headers()
                return

            cookie = self.headers.get("Cookie", "")
            try:
                conn = http.client.HTTPConnection(OAUTH2_PROXY_HOST, OAUTH2_PROXY_PORT, timeout=5)
                conn.request("GET", "/oauth2/auth", headers={"Cookie": cookie})
                resp = conn.getresponse()
                status = resp.status
                auth_header = resp.getheader("Authorization")
                resp.read()
                conn.close()
            except Exception as exc:
                sys.stderr.write(f"error calling oauth2-proxy: {exc}\n")
                status, auth_header = 401, None

            if not (200 <= status < 300) or not auth_header:
                self.send_response(401)
                self.end_headers()
                return

            token = auth_header.split(" ", 1)[-1]
            claims = decode_jwt_payload(token)
            static_token = pick_static_token(claims)

            self.send_response(200)
            self.send_header("Authorization", f"Bearer {static_token}")
            self.end_headers()

        def log_message(self, fmt, *args):
            sys.stderr.write("%s - %s\n" % (self.address_string(), fmt % args))

    if __name__ == "__main__":
        ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-auth-injector
  namespace: kubernetes-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-auth-injector
  template:
    metadata:
      labels:
        app: dashboard-auth-injector
    spec:
      containers:
      - name: injector
        image: python:3.12-alpine
        command: ["python3", "/app/server.py"]
        env:
        # Comma-separated. Replace the domain with the company's real one —
        # these must match the "email" claim in the Keycloak ID token
        # exactly (case-insensitive).
        - name: ADMIN_EMAILS
          value: "yhlinbl@REPLACE_WITH_COMPANY_DOMAIN,jhling@REPLACE_WITH_COMPANY_DOMAIN,ychang@REPLACE_WITH_COMPANY_DOMAIN"
        # Comma-separated department IDs, matched against the "dept_id"
        # claim Keycloak puts in the ID token.
        - name: POD_OPERATOR_DEPT_IDS
          value: "0021003,0021004"
        - name: ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: dashboard-static-admin-token
              key: token
        - name: POD_OPERATOR_TOKEN
          valueFrom:
            secretKeyRef:
              name: dashboard-pod-operator-token
              key: token
        - name: POD_DELETER_TOKEN
          valueFrom:
            secretKeyRef:
              name: dashboard-pod-deleter-token
              key: token
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: script
          mountPath: /app
      volumes:
      - name: script
        configMap:
          name: dashboard-auth-injector-script
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-auth-injector
  namespace: kubernetes-dashboard
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: dashboard-auth-injector
