---
# Backs oauth2-proxy's session store. Without this, oauth2-proxy stores the
# whole session (ID token + refresh token) in a browser cookie, which
# oauth2-proxy has to split across multiple chunked cookies once it exceeds
# ~4KB — a common source of nginx "too big header"/cookie issues on top of
# the Authorization-header size problem 02-ingress.yaml already works around.
# With Redis, the browser only holds a small session-ID cookie; the actual
# token data lives here server-side.
#
# No PersistentVolume on purpose: this only caches OIDC sessions, so a Redis
# restart just forces everyone to log in again — nothing worth persisting.
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: kubernetes-dashboard
type: Opaque
stringData:
  # Generate with: python3 -c "import secrets; print(secrets.token_urlsafe(24))"
  password: "REPLACE_WITH_RANDOM_PASSWORD"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: kubernetes-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command:
        - redis-server
        - --requirepass
        - $(REDIS_PASSWORD)
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: password
        ports:
        - containerPort: 6379
          name: redis
        readinessProbe:
          exec:
            command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping"]
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping"]
          initialDelaySeconds: 15
          periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: kubernetes-dashboard
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis
