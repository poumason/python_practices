---
# Allowlist of emails permitted to LOG IN at all. oauth2-proxy is now purely
# a gate — anyone on this list who logs in gets forwarded to the Dashboard as
# the SAME static cluster-admin identity (see 05-static-auth-injector.yaml).
# There's no per-user admin/viewer split anymore; add/remove emails here to
# control who can reach the Dashboard at all.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-proxy-emails
  namespace: kubernetes-dashboard
data:
  authenticated-emails.txt: |
    poumason@live.com

---
# GitLab OAuth Application credentials + cookie secret.
# Create the app at: https://gitlab.com/-/profile/applications
#   Redirect URI: https://kubedashboard.localhost/oauth2/callback
#   Scopes: openid, profile, email
# Generate the cookie secret with:
#   python3 -c "import secrets,base64; print(base64.b64encode(secrets.token_bytes(16)).decode())"
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-secret
  namespace: kubernetes-dashboard
type: Opaque
stringData:
  client-id: "REPLACE_WITH_GITLAB_APPLICATION_ID"
  client-secret: "REPLACE_WITH_GITLAB_APPLICATION_SECRET"
  cookie-secret: "REPLACE_WITH_BASE64_16BYTES_SECRET"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: kubernetes-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
        args:
        - --provider=oidc
        - --reverse-proxy=true
        - --upstream=file:///dev/null
        - --http-address=0.0.0.0:4180
        - --oidc-issuer-url=https://gitlab.com
        - --cookie-secure=true
        - --cookie-expire=30m
        # No longer critical for downstream token freshness (we forward a
        # static token now, not oauth2-proxy's own session token — see
        # 05-static-auth-injector.yaml) — this just keeps oauth2-proxy's own
        # login session refreshed against GitLab within cookie-expire.
        - --cookie-refresh=2m
        - --whitelist-domain=kubedashboard.localhost
        - --redirect-url=https://kubedashboard.localhost/oauth2/callback
        - --scope=openid profile email
        - --authenticated-emails-file=/etc/oauth2-proxy/authenticated-emails.txt
        # GitLab's ID token has no "groups" claim, so oauth2-proxy falls back
        # to calling GitLab's profile/userinfo endpoint to look for one on
        # every login — which 401s ("could not get claim \"groups\": ...
        # unexpected status 401"), blocking the OAuth callback entirely. We
        # don't use OIDC groups for RBAC (see 03-rbac.yaml, email + built-in
        # system:authenticated group), so just skip that lookup.
        - --skip-claims-from-profile-url=true
        # Store session data (ID/refresh tokens) in Redis (see 01-redis.yaml)
        # instead of a browser cookie — keeps the cookie small and avoids
        # oauth2-proxy's cookie chunking.
        - --session-store-type=redis
        - --redis-connection-url=redis://redis.kubernetes-dashboard.svc.cluster.local:6379
        env:
        - name: OAUTH2_PROXY_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: oauth2-proxy-secret
              key: client-id
        - name: OAUTH2_PROXY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: oauth2-proxy-secret
              key: client-secret
        - name: OAUTH2_PROXY_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name: oauth2-proxy-secret
              key: cookie-secret
        - name: OAUTH2_PROXY_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: password
        volumeMounts:
        - name: emails
          mountPath: /etc/oauth2-proxy
      volumes:
      - name: emails
        configMap:
          name: oauth2-proxy-emails

---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: kubernetes-dashboard
spec:
  ports:
  - name: http
    port: 4180
    protocol: TCP
    targetPort: 4180
  selector:
    app: oauth2-proxy
