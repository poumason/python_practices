---
# Keycloak OAuth client credentials + cookie secret.
# Register a confidential client in the company's Keycloak realm:
#   Redirect URI: https://kubedashboard.localhost/oauth2/callback
#   Scopes: openid, profile, email (the custom "dept_id" claim must already
#   be mapped onto the ID token by a protocol mapper on this client/realm —
#   dashboard-auth-injector reads it straight from the ID token, see
#   05-static-auth-injector.yaml)
# Generate the cookie secret with:
#   python3 -c "import secrets,base64; print(base64.b64encode(secrets.token_bytes(16)).decode())"
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-secret
  namespace: kubernetes-dashboard
type: Opaque
stringData:
  client-id: "REPLACE_WITH_KEYCLOAK_CLIENT_ID"
  client-secret: "REPLACE_WITH_KEYCLOAK_CLIENT_SECRET"
  cookie-secret: "REPLACE_WITH_BASE64_16BYTES_SECRET"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: kubernetes-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
        args:
        - --provider=oidc
        - --reverse-proxy=true
        - --upstream=file:///dev/null
        - --http-address=0.0.0.0:4180
        # Company's Keycloak realm issuer, e.g.
        # https://keycloak.company.internal/realms/<realm-name>
        - --oidc-issuer-url=REPLACE_WITH_KEYCLOAK_REALM_ISSUER_URL
        - --cookie-secure=true
        - --cookie-expire=30m
        - --cookie-refresh=2m
        - --whitelist-domain=kubedashboard.localhost
        - --redirect-url=https://kubedashboard.localhost/oauth2/callback
        - --scope=openid profile email
        # oauth2-proxy is now purely a login gate — anyone with a company
        # email can get in at all; dashboard-auth-injector (05-*.yaml) is
        # what actually decides the permission tier per-request, based on
        # the email/dept_id claims in the real ID token. Replace with the
        # real company domain.
        - --email-domain=REPLACE_WITH_COMPANY_DOMAIN
        # Skips an extra call to Keycloak's userinfo endpoint for claims
        # missing from the ID token (we don't need "groups", and "dept_id"
        # is expected to already be on the ID token via a protocol mapper —
        # one less moving part / dependency on that endpoint being reachable).
        - --skip-claims-from-profile-url=true
        # Puts the real ID token on the /oauth2/auth response's Authorization
        # header. dashboard-auth-injector reads this to decode the email/
        # dept_id claims and pick which static token to forward — see
        # 05-static-auth-injector.yaml for the full flow.
        - --set-authorization-header=true
        # Store session data (ID/refresh tokens) in Redis (see 01-redis.yaml)
        # instead of a browser cookie — keeps the cookie small and avoids
        # oauth2-proxy's cookie chunking.
        - --session-store-type=redis
        - --redis-connection-url=redis://redis.kubernetes-dashboard.svc.cluster.local:6379
        env:
        - name: OAUTH2_PROXY_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: oauth2-proxy-secret
              key: client-id
        - name: OAUTH2_PROXY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: oauth2-proxy-secret
              key: client-secret
        - name: OAUTH2_PROXY_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name: oauth2-proxy-secret
              key: cookie-secret
        - name: OAUTH2_PROXY_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: password

---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: kubernetes-dashboard
spec:
  ports:
  - name: http
    port: 4180
    protocol: TCP
    targetPort: 4180
  selector:
    app: oauth2-proxy
