# 添加 kubernetes-dashboard 仓库
helm repo add kubernetes-dashboard https://kubernetes.github.io/dashboard/
# 使用 kubernetes-dashboard Chart 部署名为 `kubernetes-dashboard` 的 Helm Release
helm upgrade --install kubernetes-dashboard kubernetes-dashboard/kubernetes-dashboard --create-namespace --namespace kubernetes-dashboard


helm upgrade --install kube-dashboard kubernetes-dashboard/kubernetes-dashboard --create-namespace --namespace kube-dashboard

kubectl -n kubernetes-dashboard port-forward svc/kubernetes-dashboard-kong-proxy 8443:443
kubectl -n kubernetes-dashboard port-forward svc/kubernetes-dashboard-kong-proxy 8443:443
kubectl -n kubernetes-dashboard create token admin-user

# Create admin ServiceAccount
kubectl create serviceaccount dashboard-admin \
  -n kubernetes-dashboard
# Bind the admin role to the ServiceAccount
kubectl create clusterrolebinding dashboard-admin-binding \
  --clusterrole=cluster-admin \
  --serviceaccount=kubernetes-dashboard:dashboard-admin
# Create a non-expiring token Secret
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-admin-token
  namespace: kubernetes-dashboard
  annotations:
    kubernetes.io/service-account.name: dashboard-admin
type: kubernetes.io/service-account-token
# Get the token (copy once, reuse forever)
kubectl -n kubernetes-dashboard get secret dashboard-admin-token \
  -o jsonpath="{.data.token}" | base64 --decode

