  apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-model-server
  namespace: vllm
  labels:
    app: vllm-model-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-model-server
  template:
    metadata:
      labels:
        app: vllm-model-server
    spec:
      containers:
        - name: vllm-model-server
          image: vllm/vllm-openai:latest
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -m
            - vllm.entrypoints.openai.api_server
          args:
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --model
            - moonshotai/Kimi-K2-Instruct
            - --served-model-name
            - kimi-2.6
            - --speculative-model
            - Qwen/Qwen2.5-Coder-7B-Instruct
            - --num-speculative-tokens
            - "5"
            - --speculative-draft-tensor-parallel-size
            - "1"
            - --tensor-parallel-size
            - "4"
            - --gpu-memory-utilization
            - "0.90"
            - --max-model-len
            - "32768"
            - --trust-remote-code
            - --enable-prefix-caching
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: HF_TOKEN
            - name: VLLM_WORKER_MULTIPROC_METHOD
              value: "spawn"
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "4"
            limits:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "4"
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 60
            failureThreshold: 5
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: vllm-model-cache-pvc
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-model-server-svc
  namespace: vllm
  labels:
    app: vllm-model-server
spec:
  selector:
    app: vllm-model-server
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
