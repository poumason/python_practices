apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-router
  namespace: vllm
  labels:
    app: vllm-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-router
  template:
    metadata:
      labels:
        app: vllm-router
    spec:
      containers:
        - name: vllm-router
          image: vllm/vllm-router:latest
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -m
            - vllm.router
          args:
            - --config
            - /etc/vllm-router/config.yaml
          ports:
            - containerPort: 8001
              name: http
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: router-config
              mountPath: /etc/vllm-router
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: router-config
          configMap:
            name: vllm-router-config
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-router-svc
  namespace: vllm
  labels:
    app: vllm-router
spec:
  selector:
    app: vllm-router
  ports:
    - name: http
      protocol: TCP
      port: 8001
      targetPort: 8001
      nodePort: 30801
  type: NodePort
