apiVersion: apps/v1
kind: Deployment
metadata:
  name: vscode-dind
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vscode-dind
  template:
    metadata:
      labels:
        app: vscode-dind
    spec:
      initContainers:
        - name: install-docker-cli
          image: docker:dind
          command: ["cp", "/usr/local/bin/docker", "/data/docker"]
          volumeMounts:
          - name: docker-bin
            mountPath: /data
      containers:
        - name: code-server
          image: codercom/code-server:latest
          args: ["--auth", "password"] # 使用密碼登入，也可設為 none
          env:
            - name: PASSWORD
              value: "admin" # 登入網頁的密碼
            - name: DOCKER_HOST
              value: tcp://localhost:2375
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: docker-bin
              mountPath: /usr/local/bin/docker
              subPath: docker
        - name: dind
          image: docker:dind
          securityContext:
            privileged: true # DinD 必須使用特權模式
          env:
            - name: DOCKER_TLS_CERTDIR
              value: "" # 內部通訊關閉 TLS 以簡化設定
      volumes:
        - name: docker-bin
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vscode-svc
spec:
  selector:
    app: vscode-dind
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vscode-ingress
  annotations:
    # 這是重點：讓 code-server 的 Websocket 能正常運作
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
  - host: vscode.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vscode-svc
            port:
              number: 80