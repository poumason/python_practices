services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.96.2
    # image: local/litellm:v1.92.0-dev1
    # image: localhost/litellm:latest
    container_name: litellm_proxy
    #########################################
    ## Uncomment these lines to start proxy with a config.yaml file ##
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
      # 2. 掛載你的 Custom Logger 腳本到 /app 目錄下
      #  - ./flatten_mcp.py:/app/flatten_mcp.py
      - ./v1.92.0/responses/litellm_completion_transformation/transformation.py:/app/.venv/lib/python3.13/site-packages/litellm/responses/litellm_completion_transformation/transformation.py
      - ./v1.92.0/responses/litellm_completion_transformation/streaming_iterator.py:/app/.venv/lib/python3.13/site-packages/litellm/responses/litellm_completion_transformation/streaming_iterator.py
    command:
     - "--config=/app/config.yaml"
    ##############################################
    ports:
      - "4000:4000" # Map the container port to the host, change the host port if necessary
    environment:
      DATABASE_URL: "postgresql://llmproxy:dbpassword9090@db:5432/litellm"
      STORE_MODEL_IN_DB: "True" # allows adding models to proxy via UI
      # 3. 【關鍵】告訴 Python 去 /app 目錄下尋找模組
      # PYTHONPATH: "/app"
      LITELLM_LOG: "DEBUG"
      REDIS_SENTINEL_NODES: '[["sentinel-1", 26379], ["sentinel-2", 26379], ["sentinel-3", 26379]]'
      REDIS_SERVICE_NAME: "mymaster"
      REDIS_SENTINEL_PASSWORD: "redis1234"
      REDIS_PASSWORD: "redis1234"
    env_file:
      - .env # Load local .env file
    depends_on:
      - db  # Indicates that this service depends on the 'db' service, ensuring 'db' starts first
    networks:
      - default
      - redis-net
    healthcheck:  # Defines the health check configuration for the container
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"  # Command to execute for health check
      interval: 30s  # Perform health check every 30 seconds
      timeout: 10s   # Health check command times out after 10 seconds
      retries: 3     # Retry up to 3 times if health check fails
      start_period: 40s  # Wait 40 seconds after container start before beginning health checks

  db:
    image: postgres:16
    restart: always
    container_name: litellm_db
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: dbpassword9090
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persists Postgres data across container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U llmproxy"]
      interval: 1s
      timeout: 5s
      retries: 10

  # prometheus:
  #   image: prom/prometheus
  #   volumes:
  #     - prometheus_data:/prometheus
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml
  #   ports:
  #     - "9090:9090"
  #   command:
  #     - "--config.file=/etc/prometheus/prometheus.yml"
  #     - "--storage.tsdb.path=/prometheus"
  #     - "--storage.tsdb.retention.time=15d"
  #   restart: always

volumes:
  prometheus_data:
    driver: local
  postgres_data:
    name: litellm_postgres_data # Named volume for Postgres data persistence

networks:
  redis-net:
    external: true
    name: redis-sentinel_redis-net