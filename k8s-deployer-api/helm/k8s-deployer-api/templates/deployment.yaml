apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-deployer-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-deployer-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "k8s-deployer-api.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k8s-deployer-api.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "k8s-deployer-api.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: DEFAULT_IMAGE
              value: {{ .Values.env.defaultImage | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
