apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "k8s-deployer-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-deployer-api.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "k8s-deployer-api.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "k8s-deployer-api.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
