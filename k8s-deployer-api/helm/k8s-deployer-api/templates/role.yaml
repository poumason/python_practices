# Namespace-scoped on purpose: this app only ever creates/deletes Deployments
# in its own Release.Namespace, never across namespaces (no ClusterRole).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "k8s-deployer-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-deployer-api.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "delete", "watch"]
