apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8s-deployer-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-deployer-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "k8s-deployer-api.labels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
