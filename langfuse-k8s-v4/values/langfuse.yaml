# Langfuse v4（web + worker）— chart 2.2.5（appVersion 4.80.0），所有儲存層全部外接（deploy: false），不使用任何 CRD
# release 名稱：langfuse
#
# 與 v3 版（../langfuse-k8s）的差別：這份是 v4，ClickHouse 必須 >= 25.12（用官方 image 自建的 charts/clickhouse-ha）。
# 所有主機名稱都用「同 namespace 的短名稱」，不寫死 namespace 或 cluster.local。
# 所有密碼都從 scripts/create-secrets.sh 建立的 Secret 讀取，這份檔案裡沒有任何密碼。
langfuse:
  # 與 chart 2.2.5 的 appVersion 一致（chart 與 app 的搭配由 Langfuse 維護；不要隨意混用差太多的版本）
  image:
    tag: "4.80.0"
    pullPolicy: IfNotPresent

  logging:
    level: info
    format: json

  salt:
    secretKeyRef: { name: langfuse-app-secrets, key: salt }
  encryptionKey:
    secretKeyRef: { name: langfuse-app-secrets, key: encryption-key }
  nextauth:
    url: "http://localhost:3000"        # install.sh 用 LANGFUSE_URL 覆蓋成對外網址
    secret:
      secretKeyRef: { name: langfuse-app-secrets, key: nextauth-secret }

  features:
    telemetryEnabled: false             # 公司內部部署不對外回報；要開請改 true
    signUpDisabled: false

  nodeEnv: production

  # Ingress 預設關閉（網域/TLS/ingress class 各公司不同）。要開請見 README「對外存取」
  ingress:
    enabled: false

  # 官方最低需求：web / worker 各 2 CPU、4 GiB（Langfuse docs: scaling → Minimum Infrastructure Requirements）。
  # requests 取較小值讓測試叢集排得進去，limit 給到官方最低的記憶體；正式環境請把 requests 也調到官方最低以上。
  # （v3 實測 web 在 1Gi limit 會 OOM（exit 134），v4 的最低需求更高。）
  web:
    replicas: 1
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { memory: 4Gi }

  worker:
    replicas: 1
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { memory: 4Gi }

postgresql:
  deploy: false
  host: postgresql-ha-pgpool
  port: 5432
  auth:
    username: langfuse
    database: langfuse
    existingSecret: langfuse-postgresql-auth
    secretKeys:
      userPasswordKey: password
  migration:
    autoMigrate: true

redis:
  deploy: false
  sentinel:
    enabled: true
    masterName: mymaster
    nodes: "langfuse-redis-node-0.langfuse-redis-headless:26379,langfuse-redis-node-1.langfuse-redis-headless:26379,langfuse-redis-node-2.langfuse-redis-headless:26379"
    existingSecret: langfuse-redis-auth       # 這版 Bitnami redis 的 Sentinel 與 Redis 共用同一組密碼
    existingSecretPasswordKey: redis-password
  auth:
    username: default
    existingSecret: langfuse-redis-auth
    existingSecretPasswordKey: redis-password
    database: 0
  tls:
    enabled: false

clickhouse:
  deploy: false                             # 不用 operator/CRD
  host: langfuse-clickhouse
  httpPort: 8123
  nativePort: 9000
  database: default
  cluster:
    enabled: true                           # ON CLUSTER DDL + ReplicatedMergeTree（cluster 名稱 "default"）
  auth:
    username: default
    existingSecret: langfuse-clickhouse-auth
    existingSecretKey: admin-password
  migration:
    autoMigrate: true
    ssl: false

s3:
  deploy: false
  storageProvider: s3
  endpoint: "http://langfuse-minio:9000"
  region: "us-east-1"                       # MinIO 任意非空值即可
  forcePathStyle: true                      # MinIO 必須
  bucket: langfuse
  accessKeyId:
    secretKeyRef: { name: langfuse-minio-auth, key: root-user }
  secretAccessKey:
    secretKeyRef: { name: langfuse-minio-auth, key: root-password }
  eventUpload:
    bucket: langfuse-events
  batchExport:
    enabled: true
    bucket: langfuse-exports
  mediaUpload:
    enabled: true
    bucket: langfuse-media
    maxContentLength: 1000000000
    downloadUrlExpirySeconds: 3600
